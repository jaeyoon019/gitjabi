<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>깃잡이 GitHub 실습</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 메뉴: 가이드(guide) 페이지들과 같은 메뉴. 이 페이지는 practice 폴더 안에 있어서 링크 앞에 ../ 가 붙는다 -->
  <header class="site-nav">
    <div class="wrap">
      <a class="brand" href="../index.html">깃<span>잡이</span></a>
      <a class="link" href="../index.html">홈</a>
      <a class="link" href="../git-github.html">Git과 GitHub</a>
      <a class="link" href="../github-site.html">GitHub 화면</a>
      <a class="link" href="../workflow.html">개인 작업</a>
      <a class="link" href="../team.html">팀 작업</a>
      <a class="link" href="../troubleshoot.html">문제해결</a>
      <a class="link" href="../commands.html">명령어 모음</a>
      <a class="link" href="index.html" aria-current="page">실습</a>
    </div>
  </header>

  <main>
    <div class="page-head">
      <p class="eyebrow">GitHub 실습</p>
      <h1>깃잡이 GitHub 실습</h1>
      <p class="lead">직접 해 보고, 페이지가 GitHub에서 결과를 확인합니다.</p>
    </div>

    <!-- 아이디 입력 -->
    <section id="login" hidden>
      <label for="user-input">GitHub 아이디</label>
      <div class="row">
        <input id="user-input" autocomplete="username" spellcheck="false" placeholder="예: octocat">
        <button id="login-btn">시작하기</button>
      </div>
      <p class="hint">계정이 없으면 <a href="https://github.com/signup" target="_blank" rel="noopener">github.com/signup</a>에서 먼저 만드세요.</p>
    </section>

    <!-- 저장된 진행 이어하기 -->
    <section id="resume" hidden>
      <p><b id="resume-user"></b> 아이디로 진행하던 기록이 있어요.</p>
      <div class="row">
        <button id="resume-btn">이어서 하기</button>
        <button id="switch-btn" class="secondary">다른 아이디로</button>
      </div>
    </section>

    <!-- 단계 카드 -->
    <section id="step" hidden>
      <div class="progress"><div id="progress-bar"></div></div>
      <p class="meta"><span id="step-count"></span> · <span id="step-user"></span> <button id="switch-btn2" class="link">다른 아이디로</button></p>
      <h2 id="step-title"></h2>
      <div id="step-guide"></div>
      <button id="check-btn">완료했어요</button>
    </section>

    <!-- 수료 -->
    <section id="done" hidden>
      <div class="progress"><div style="width:100%"></div></div>
      <h2>🎉 모든 단계를 마쳤어요</h2>
      <p>웹 화면에서 저장소·파일·브랜치를 만들고, cmd에서 클론·커밋·푸시까지 직접 해 봤습니다.</p>
      <button id="restart-btn" class="secondary">처음부터 다시</button>
    </section>

    <p id="msg" role="status" hidden></p>
  </main>

  <footer class="site-footer">
    <div class="wrap">깃잡이 · 팀 문제해결 프로젝트</div>
  </footer>

  <script src="steps.js"></script>
  <script src="app.js"></script>
</body>
</html>
